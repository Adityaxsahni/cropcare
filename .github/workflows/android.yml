name: Android APK

# Builds an installable APK in the cloud, no Expo account needed.
# - With a real model committed in app/assets/model/, the APK is named after its version.
# - Without one, it uses the UNTRAINED stand-in (ml/scripts/make_standin_model.py) so the build itself
#   can be checked. That APK is named "untrained-test-build" and the app shows a red warning.
# - Pushing a tag like v1.0.0 attaches the APK to a GitHub Release, but only with a real model.
# Release builds are signed with the debug key: fine for installing on pilot phones, not for the Play Store.

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "app/**"
      - "ml/class_map.json"
      - ".github/workflows/android.yml"

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CI: "1"
      # Optional repository variables (Settings > Secrets and variables > Actions > Variables).
      EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL }}
      EXPO_PUBLIC_PRIVACY_URL: ${{ vars.EXPO_PUBLIC_PRIVACY_URL }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Model
        id: model
        run: |
          if [ -f app/assets/model/cropcare.tflite ] && [ -f app/assets/model/model_meta.json ]; then
            version=$(python -c "import json; print(json.load(open('app/assets/model/model_meta.json'))['version'])")
          else
            pip install -q "tensorflow-cpu>=2.16,<2.21" || pip install -q "tensorflow>=2.16,<2.21"
            (cd ml && python scripts/make_standin_model.py --out ../app/assets/model)
            version=0.0.0-standin
          fi
          case "$version" in
            0.0.0*) kind=untrained-test-build ;;
            *) kind="model-$version" ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "kind=$kind" >> "$GITHUB_OUTPUT"
          echo "Model version: $version ($kind)" >> "$GITHUB_STEP_SUMMARY"

      - name: Refuse to release an untrained model
        if: startsWith(github.ref, 'refs/tags/v') && startsWith(steps.model.outputs.version, '0.0.0')
        run: |
          echo "::error::Tag ${GITHUB_REF_NAME} has no trained model in app/assets/model. Commit the real model first."
          exit 1

      - run: npm ci
        working-directory: app

      # Every build gets a higher versionCode, so Android installs it as an update of the last one.
      - name: Set versionCode
        run: |
          python - <<'EOF'
          import json, os
          p = "app.json"
          cfg = json.load(open(p, encoding="utf-8"))
          cfg["expo"]["android"]["versionCode"] = int(os.environ["GITHUB_RUN_NUMBER"])
          json.dump(cfg, open(p, "w", encoding="utf-8"), indent=2, ensure_ascii=False)
          EOF
          echo "versionCode: $GITHUB_RUN_NUMBER" >> "$GITHUB_STEP_SUMMARY"
        working-directory: app

      - name: Generate the Android project
        run: npx expo prebuild --platform android --no-install
        working-directory: app

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=armeabi-v7a,arm64-v8a
        working-directory: app/android

      # Gradle signs with v2 only (minSdk 24). Vivo, Oppo and Realme installers still check the v1 (JAR)
      # signature and refuse a v2-only APK with a bare "App not installed", so sign again with v1, v2 and v3,
      # same debug key as before, after aligning native libraries to 16 KB pages.
      - name: Name and sign the APK
        id: apk
        run: |
          name="cropcare-${{ steps.model.outputs.kind }}.apk"
          tools="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          "$tools/zipalign" -f -P 16 4 app/android/app/build/outputs/apk/release/app-release.apk aligned.apk
          "$tools/apksigner" sign --ks app/android/app/debug.keystore --ks-key-alias androiddebugkey \
            --ks-pass pass:android --key-pass pass:android \
            --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true \
            --out "$name" aligned.apk
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "APK: $name ($(du -h "$name" | cut -f1))" >> "$GITHUB_STEP_SUMMARY"

      # Fails the build if the APK would not install: a missing signature scheme, unaligned files,
      # or no package line in the manifest.
      - name: Check the APK installs
        run: |
          apk="${{ steps.apk.outputs.name }}"
          tools="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          "$tools/apksigner" verify --verbose --print-certs "$apk" > apksigner.txt 2>&1 || { cat apksigner.txt; exit 1; }
          "$tools/aapt2" dump badging "$apk" > badging.txt
          {
            echo '```'
            grep -E "^Verified using v[123] scheme|^Signer #1 certificate (DN|SHA-256)" apksigner.txt
            grep -E "^package:|[Ss]dkVersion|^native-code|^uses-permission" badging.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          for v in "v2 scheme (APK Signature Scheme v2)" "v3 scheme (APK Signature Scheme v3)"; do
            grep -qF "Verified using $v: true" apksigner.txt || { echo "::error::APK is not signed with $v"; exit 1; }
          done
          # apksigner only checks v1 for Android versions that need it, so ask as Android 6 would,
          # and make sure the JAR signature files are really in the APK.
          "$tools/apksigner" verify --min-sdk-version 23 --verbose "$apk" > apksigner-v1.txt 2>&1 || { cat apksigner-v1.txt; exit 1; }
          grep -qF "Verified using v1 scheme (JAR signing): true" apksigner-v1.txt || { echo "::error::APK is not signed with v1 (JAR)"; exit 1; }
          unzip -l "$apk" | grep -qE "META-INF/[^/]+\.SF$" || { echo "::error::APK has no META-INF signature file"; exit 1; }
          echo "v1 (JAR) signature: verified as Android 6 would check it" >> "$GITHUB_STEP_SUMMARY"
          "$tools/zipalign" -c -P 16 4 "$apk" || { echo "::error::APK is not aligned"; exit 1; }
          grep -q "^package: name='com.cropcare.app'" badging.txt

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.apk.outputs.name }}
          path: ${{ steps.apk.outputs.name }}
          retention-days: ${{ startsWith(steps.model.outputs.version, '0.0.0') && 3 || 30 }}

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ steps.apk.outputs.name }}
          # A tag with a suffix, such as v1.0.0-pilot.1, is a pilot build, not the public launch.
          prerelease: ${{ contains(github.ref_name, '-') }}
          name: ${{ contains(github.ref_name, '-') && format('CropCare {0} (pilot test build)', github.ref_name) || format('CropCare {0}', github.ref_name) }}
          body_path: docs/RELEASE_NOTES.md
          generate_release_notes: true
