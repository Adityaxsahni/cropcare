name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install numpy pillow pytest
      - run: python -m pytest -q
        working-directory: ml

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
        working-directory: backend
      - run: python -m pytest -q
        working-directory: backend

  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Model metadata for type checking
        # Without a committed model, typecheck against the stand-in metadata (no TensorFlow needed).
        run: |
          if [ ! -f assets/model/model_meta.json ]; then
            python ../ml/scripts/make_standin_model.py --out assets/model --meta-only
            touch assets/model/cropcare.tflite
          fi
      - run: npm ci
      - run: npm run typecheck
      - run: npx expo lint
      - run: npm test

  launch-gate:
    # Informational until the custom domain and privacy contact exist (docs/LAUNCH.md).
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python scripts/check_launch.py
