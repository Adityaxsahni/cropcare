# Render blueprint for the CropCare backend.
# Deploy: https://render.com/deploy?repo=https://github.com/Adityaxsahni/cropcare
#
# Free tier, as Render documents it (checked 2026-10-22):
# - the web service sleeps after 15 minutes without traffic and wakes on the next
#   request; the app keeps unsent results and retries, so nothing is lost
# - a free Render Postgres database is deleted 30 days after it is created.
#   Before then, create a free database that does not expire (for example Neon),
#   and replace DATABASE_URL on the service with its connection string.
# SQLite is not used here: free web services have no persistent disk.

# Both in Singapore (closest to Bihar): a database is only reachable by its internal
# address from services in the same region, and regions cannot be changed later.
databases:
  - name: cropcare-db
    plan: free
    region: singapore

services:
  - type: web
    name: cropcare-api
    runtime: python
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python -m app
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: DATABASE_URL
        fromDatabase:
          name: cropcare-db
          property: connectionString
      - key: ADMIN_TOKEN
        generateValue: true
      # Render puts one proxy in front of the service; trust only the address it appends.
      - key: TRUSTED_PROXY_HOPS
        value: "1"
